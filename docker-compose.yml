version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nivasa-db
    restart: always
    environment:
      POSTGRES_USER: nivasa_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nivasa
    ports:
      - "5432:5432"
    volumes:
      - ../nivasa_dbdata:/var/lib/postgresql/data

volumes:
  nivasa_dbdata:
